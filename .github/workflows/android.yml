name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secret names kept from the PetCare era (renaming them would mean entering them again in GitHub).
      PETCARE_KEYSTORE_BASE64: ${{ secrets.PETCARE_KEYSTORE_BASE64 }}
      PETCARE_KEYSTORE_PASSWORD: ${{ secrets.PETCARE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The permanent key (repository secrets): every APK is signed the same way, so Android installs
      # each update over the previous one and keeps the data. Never generate another one here.
      - name: Use the permanent signing key
        if: env.PETCARE_KEYSTORE_BASE64 != ''
        run: |
          echo "$PETCARE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "PETCARE_KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Signing key missing
        if: env.PETCARE_KEYSTORE_BASE64 == ''
        run: echo "::warning::Secrets PETCARE_KEYSTORE_BASE64 / PETCARE_KEYSTORE_PASSWORD not set — the APK is built but not published (it could not update the installed app)."

      - name: Tests (schedule, prescription reader, app flow and reminders)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: noami-pets-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Direct download link for the phone: Releases -> "Noami Pets (dernière version)" -> noami-pets.apk
      - name: Publish APK to the "noami-pets-latest" release
        # Only the main branch publishes: a work branch (open PR) must not replace the APK people install.
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && env.PETCARE_KEYSTORE_BASE64 != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk noami-pets.apk
          git tag -f noami-pets-latest
          git push -f origin noami-pets-latest
          gh release view noami-pets-latest >/dev/null 2>&1 || \
            gh release create noami-pets-latest --title "Noami Pets (dernière version)" \
              --notes "APK à installer : adb install -r noami-pets.apk (garde les données)."
          gh release upload noami-pets-latest noami-pets.apk --clobber
          # The version and date in the release text: easy to see on the phone that the APK is the new one.
          gh release edit noami-pets-latest --notes "Version 1.0.$(( GITHUB_RUN_NUMBER + 100 )) ($(echo $GITHUB_SHA | cut -c1-7)), publiée le $(TZ=America/Sao_Paulo date '+%d/%m/%Y à %H:%M'). APK à installer par-dessus l'application : les données sont gardées."
        env:
          GH_TOKEN: ${{ github.token }}

      # Keep the latest APK on an orphan branch so it can be fetched with plain git.
      - name: Publish APK to the "apk-build" branch
        # Only the main branch publishes: a work branch (open PR) must not replace the APK people install.
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && env.PETCARE_KEYSTORE_BASE64 != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -r -q --cached .
          git add -f noami-pets.apk
          git commit -q -m "Noami Pets APK built from ${GITHUB_SHA}"
          git push -f origin HEAD:apk-build
