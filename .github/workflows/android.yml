name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PETCARE_KEYSTORE_BASE64: ${{ secrets.PETCARE_KEYSTORE_BASE64 }}
      PETCARE_KEYSTORE_PASSWORD: ${{ secrets.PETCARE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The permanent key (repository secrets): every APK is signed the same way, so Android installs
      # each update over the previous one and keeps the data. Never generate another one here.
      - name: Use the permanent signing key
        if: env.PETCARE_KEYSTORE_BASE64 != ''
        run: |
          echo "$PETCARE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/petcare.jks"
          echo "PETCARE_KEYSTORE_FILE=$RUNNER_TEMP/petcare.jks" >> "$GITHUB_ENV"

      - name: Signing key missing
        if: env.PETCARE_KEYSTORE_BASE64 == ''
        run: echo "::warning::Secrets PETCARE_KEYSTORE_BASE64 / PETCARE_KEYSTORE_PASSWORD not set — the APK is built but not published (it could not update the installed app)."

      - name: Tests (schedule, prescription reader, app flow and reminders)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: petcare-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Direct download link for the phone: Releases -> "PetCare (dernière version)" -> petcare.apk
      - name: Publish APK to the "petcare-latest" release
        if: github.event_name != 'pull_request' && env.PETCARE_KEYSTORE_BASE64 != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk petcare.apk
          git tag -f petcare-latest
          git push -f origin petcare-latest
          gh release view petcare-latest >/dev/null 2>&1 || \
            gh release create petcare-latest --title "PetCare (dernière version)" \
              --notes "APK à installer : adb install -r petcare.apk (garde les données)."
          gh release upload petcare-latest petcare.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Keep the latest APK on an orphan branch so it can be fetched with plain git.
      - name: Publish APK to the "apk-build" branch
        if: github.event_name != 'pull_request' && env.PETCARE_KEYSTORE_BASE64 != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -r -q --cached .
          git add -f petcare.apk
          git commit -q -m "PetCare APK built from ${GITHUB_SHA}"
          git push -f origin HEAD:apk-build
